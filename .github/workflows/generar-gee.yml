
name: Generar datos historicos GEE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-datos:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configurar credenciales de Earth Engine
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
        run: |
          python -c "import os; from pathlib import Path; p=Path(os.environ['RUNNER_TEMP'])/'gee-service-account.json'; p.write_text(os.environ['GEE_SERVICE_ACCOUNT_JSON']); print('Credenciales configuradas')"

      - name: Generar datos historicos
        env:
          GEE_PROJECT_ID: geoportal-gee-peru
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gee-service-account.json
        run: |
          python py/gee_expansion.py
          python py/make_data.py

      - name: Comprobar datos generados
        run: |
          test -f data/expansion_gee.json
          echo "Archivo historico generado correctamente"
          ls -lh data/

      - name: Guardar datos en GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No hay cambios nuevos para guardar"
          else
            git commit -m "Generar datos historicos de Google Earth Engine"
            git push
          fi
